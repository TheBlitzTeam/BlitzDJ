name: Build BlitzDJ

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:
    inputs:
      platform:
        description: "Select the build platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
          - android
          - ios

      build_type:
        description: "Select the build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

      enable_bluetooth:
        description: "Enable Bluetooth support"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  REQUESTED_PLATFORM: ${{ inputs.platform || 'all' }}

jobs:
  desktop:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'windows' || inputs.platform == 'linux' || inputs.platform == 'macos' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: BlitzDJ-Windows

          - platform: linux
            os: ubuntu-24.04
            artifact: BlitzDJ-Linux

          - platform: macos
            os: macos-latest
            artifact: BlitzDJ-macOS

    steps:
      - name: Check selected platform
        id: selection
        shell: bash
        run: |
          if [[ "$REQUESTED_PLATFORM" == "all" || "$REQUESTED_PLATFORM" == "${{ matrix.platform }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.selection.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup CMake
        if: steps.selection.outputs.enabled == 'true'
        uses: lukka/get-cmake@latest

      - name: Install Linux dependencies
        if: steps.selection.outputs.enabled == 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev libglib2.0-dev xorg-dev libgl1-mesa-dev

      - name: Install Windows dependencies
        if: steps.selection.outputs.enabled == 'true' && matrix.platform == 'windows'
        shell: pwsh
        run: vcpkg install curl:x64-windows

      - name: Configure
        if: steps.selection.outputs.enabled == 'true'
        shell: bash
        env:
          ENABLE_BLUETOOTH: ${{ github.event_name == 'workflow_dispatch' && !inputs.enable_bluetooth && 'OFF' || 'ON' }}
        run: |
          EXTRA_ARGS=()

          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            EXTRA_ARGS+=("-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake")
            EXTRA_ARGS+=("-DVCPKG_TARGET_TRIPLET=x64-windows")
          fi

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DBLITZDJ_ENABLE_BLUETOOTH="$ENABLE_BLUETOOTH" \
            -DBLITZDJ_BUILD_TESTS=ON \
            -DBLITZDJ_ENABLE_LTO=ON \
            "${EXTRA_ARGS[@]}"

      - name: Build
        if: steps.selection.outputs.enabled == 'true'
        shell: bash
        run: cmake --build build --config "$BUILD_TYPE" --parallel 4

      - name: Test
        if: steps.selection.outputs.enabled == 'true'
        shell: bash
        run: ctest --test-dir build --build-config "$BUILD_TYPE" --output-on-failure

      - name: Install
        if: steps.selection.outputs.enabled == 'true'
        shell: bash
        run: cmake --install build --config "$BUILD_TYPE" --prefix "$GITHUB_WORKSPACE/dist"

      - name: Bundle Windows runtime
        if: steps.selection.outputs.enabled == 'true' && matrix.platform == 'windows'
        shell: bash
        run: |
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/*.dll "$GITHUB_WORKSPACE/dist/bin/" || true

      - name: Package
        if: steps.selection.outputs.enabled == 'true'
        shell: bash
        run: |
          cd build
          cpack -C "$BUILD_TYPE"

      - name: Upload executable
        if: steps.selection.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ env.BUILD_TYPE }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload packages
        if: steps.selection.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-Package-${{ env.BUILD_TYPE }}
          path: |
            build/*.zip
            build/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build android
    runs-on: ubuntu-24.04
    if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'android' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: android
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          if [[ "$BUILD_TYPE" == "Debug" ]]; then
            gradle --no-daemon assembleDebug
          else
            gradle --no-daemon assembleRelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlitzDJ-Android-${{ env.BUILD_TYPE }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build ios
    runs-on: macos-latest
    if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'ios' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Build device library
        run: |
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DBLITZDJ_ENABLE_BLUETOOTH=OFF \
            -DBLITZDJ_ENABLE_LTO=OFF
          cmake --build build-ios --parallel 4
          cmake --install build-ios --prefix "$GITHUB_WORKSPACE/dist-ios"

      - name: Build simulator library
        run: |
          cmake -S . -B build-sim -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DBLITZDJ_ENABLE_BLUETOOTH=OFF \
            -DBLITZDJ_ENABLE_LTO=OFF
          cmake --build build-sim --parallel 4
          cmake --install build-sim --prefix "$GITHUB_WORKSPACE/dist-sim"

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library dist-ios/lib/libblitzdj.a -headers dist-ios/include/blitzdj \
            -library dist-sim/lib/libblitzdj.a -headers dist-sim/include/blitzdj \
            -output BlitzDJ.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: BlitzDJ-iOS-${{ env.BUILD_TYPE }}
          path: BlitzDJ.xcframework
          if-no-files-found: error
          retention-days: 14
